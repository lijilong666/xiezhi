# Example workflow: drop into your repository as .github/workflows/xiezhi.yml
# (replace YOUR_NAME with the account that hosts the xiezhi repository).

name: xiezhi review
on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: YOUR_NAME/xiezhi@main
        with:
          deepseek-api-key: ${{ secrets.DEEPSEEK_API_KEY }}
          # github-token defaults to the workflow token

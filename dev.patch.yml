# Dev overlay for running the plugin from source inside a harness checkout:
# the Loader feeds `name` straight to ESM import, so on Windows it must be a
# file:// URL (plain absolute paths work on macOS/Linux).

- insert:
    - id: xiezhi
      name: 'file:///D:/Work/projects/deepseek_harness/harness/xiezhi/src/index.ts'
      config:
        # M5 final (2026-09-15, zhipu quota-aware): verifier tool loop OFF — token-bucket 429s
        # killed every large verifier prompt; plain batched checklist is the zhipu-proven config.
        adaptive: true
        hybridPlanner: true
        evidence: true
        verifierTools: false
        execver: true
